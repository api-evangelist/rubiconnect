        type: oauth2
        description: OAuth 2.0 authorization code + PKCE for the hosted MCP server (scope "mcp").
        flows:
          authorizationCode:
            authorizationUrl: https://console.rubiconnect.com/en/authorize
            tokenUrl: https://console.rubiconnect.com/api/oauth/token
            scopes:
              mcp: Access the RubiConnect hosted MCP server and its tools.
  - target: $.paths['/messages/send'].post
    description: Flag the non-reversible, non-idempotent nature of message dispatch for agent safety.
    update:
      x-idempotent: false
      x-reversible: false
      x-agent-warning: >-
        Message dispatch is fire-and-forget with no idempotency key and no cancel/recall path;
