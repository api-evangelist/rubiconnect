generated: '2026-09-15'
method: searched
source: >-
  https://github.com/zarelan/rubiconnect-mcp (README + package.json + smithery.yaml),
  live probe of https://console.rubiconnect.com/api/mcp, and
  https://console.rubiconnect.com/.well-known/oauth-authorization-server
name: RubiConnect MCP Server
description: >-
  Official first-party MCP server for the RubiConnect RCS Business Messaging and WhatsApp
  Business platform. Exposes 18 tools spanning capability checks, rich messaging, inbox,
  templates, campaigns, agents, analytics, and media search.
deployment:
  mode: both
  endpoint: https://console.rubiconnect.com/api/mcp
  transport: sse
  install: "npx -y rubiconnect-mcp"
  package: https://github.com/zarelan/rubiconnect-mcp
  auth: oauth
  verified: probed
  note: >-
    Remote endpoint verified live (HTTP 401 "Unauthorized: Invalid or missing API Key" on an
    anonymous tools/list POST, confirming the server exists and is auth-gated). It authenticates
    via OAuth 2.0 + PKCE (dynamic client registration, scope "mcp", per the served
    oauth-authorization-server metadata) or a Bearer API key (rc_live_...). The stdio option is a
    thin bridge (bin/index.mjs) that proxies local stdio to the same remote SSE endpoint; the
    npm package "rubiconnect-mcp" named in the install command is NOT published to the npm
    registry (registry.npmjs.org/rubiconnect-mcp returns 404 as of 2026-09-15), so `npx -y
    rubiconnect-mcp` and the Smithery install would currently fail until it is published — the
    remote endpoint is the only working path today.
auth:
  scheme: oauth2-pkce | bearer-api-key
  oauth_authorization_endpoint: https://console.rubiconnect.com/en/authorize
  oauth_token_endpoint: https://console.rubiconnect.com/api/oauth/token
  oauth_registration_endpoint: https://console.rubiconnect.com/api/oauth/register
  scopes:
    - mcp
tools:
